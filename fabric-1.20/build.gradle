plugins {
    id 'fabric-loom' version '1.18.2'
    id 'java'
}

base {
    archivesName = "voicechat-audio-distance-fabric-1.1.0+mc1.20.1"
}

repositories {
    mavenCentral()
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "TerraformersMC"
        url = 'https://maven.terraformersmc.com/releases'
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:0.16.13"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.0"
    modCompileOnly "com.terraformersmc:modmenu:7.2.2"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": "1.1.0+mc1.20.1"
    }
    filesMatching("META-INF/*.toml") {
        expand "version": "1.1.0+mc1.20.1"
    }
}

jar {
    from project(':common').sourceSets.main.output
}

remapJar {
    archiveClassifier = ''
}

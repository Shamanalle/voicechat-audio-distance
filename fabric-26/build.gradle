plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'java'
}

// Minecraft 26.3 (unobfuscated, no remapping)
def target = "mc26.x"
version = "${project.mod_version}+${target}"

base {
    archivesName = "voicechat-audio-distance-fabric"
}

repositories {
    mavenCentral()
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "TerraformersMC"
        url = 'https://maven.terraformersmc.com/releases'
    }
}

sourceSets {
    main {
        java {
            srcDir "${rootDir}/shared/mc-all/src/main/java"
        }
    }
}

// The 26.x compatibility check compiles against older Fabric API builds, some of whose injected
// interfaces name classes the build does not ship (EntityLoadData in 0.145.4+26.1.1). The mod calls
// no injected interface, so the check compiles without them: -PnoInterfaceInjection=true
if (project.findProperty('noInterfaceInjection') == 'true') {
    loom {
        interfaceInjection {
            enableDependencyInterfaceInjection = false
        }
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:${project.mc26_minecraft}"
    implementation "net.fabricmc:fabric-loader:${project.mc26_fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.mc26_fabric_api}"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.mc26_modmenu}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version

    filesMatching(["fabric.mod.json", "META-INF/*.toml"]) {
        expand "version": project.version
    }
}

jar {
    from project(':common').sourceSets.main.output
}

// The classpath the mod compiles against, one entry per line. The 26.x compatibility check
// (.github/workflows/compat-26.yml) compares the jar against this list for each Minecraft version.
tasks.register('writeCompileClasspath') {
    def out = layout.buildDirectory.file('compile-classpath.txt')
    def files = sourceSets.main.compileClasspath
    outputs.file out
    outputs.upToDateWhen { false }
    doLast {
        out.get().asFile.text = files.files.join('\n') + '\n'
    }
}

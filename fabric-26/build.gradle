plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'java'
}

base {
    archivesName = "voicechat-audio-distance-fabric-1.1.0+mc26.x"
}

repositories {
    mavenCentral()
    maven {
        name = "henkelmax.public"
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    maven {
        name = "TerraformersMC"
        url = 'https://maven.terraformersmc.com/releases'
    }
}

dependencies {
    implementation project(':common')

    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.19.5"
    implementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.3"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.0"
    compileOnly "com.terraformersmc:modmenu:21.0.0-beta.1"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": "1.1.0+mc26.x"
    }
    filesMatching("META-INF/*.toml") {
        expand "version": "1.1.0+mc26.x"
    }
}

jar {
    from project(':common').sourceSets.main.output
}

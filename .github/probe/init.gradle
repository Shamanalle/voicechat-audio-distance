allprojects {
    afterEvaluate { p ->
        if (p.plugins.hasPlugin('java') && p.name.startsWith('fabric')) {
            p.tasks.register('probeClasspath') {
                def out = p.layout.buildDirectory.file('probe-classpath.txt')
                def files = p.sourceSets.main.compileClasspath
                outputs.upToDateWhen { false }
                doLast { out.get().asFile.text = files.files.join('\n') + '\n' }
            }
        }
    }
}

name: "💡 Идея / Feature request"
description: "Предложить улучшение / Suggest an improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Опишите, какую задачу хотите решить — так проще найти лучшее решение, чем от готовой идеи.
        Describe the problem you want solved — that helps find the best solution, not just the first one.

  - type: textarea
    id: problem
    attributes:
      label: "Какую задачу решаем / What problem does it solve"
      placeholder: "На ивентах далёких игроков почти не слышно, даже когда… / At events distant players are barely audible, even when…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Как это могло бы работать / How it could work"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Что пробовали вместо / Alternatives you tried"
      description: "Пресеты, настройки, другие моды / Presets, settings, other mods"

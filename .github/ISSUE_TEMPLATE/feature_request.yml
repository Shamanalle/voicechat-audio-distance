name: Feature Request
description: Suggest an idea or enhancement for VoiceChat Audio Distance Addon
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make 3D voice chat physics or controls even better? Let us know!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
      placeholder: "I find it difficult to..."
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or features you've thought about.
    validations:
      required: false

name: Sync release notes

# Keeps the notes of published GitHub releases equal to their CHANGELOG.md section (English, then
# Russian). Runs when CHANGELOG.md changes on main, or by hand for one tag or for every release.

on:
  push:
    branches: [ "main" ]
    paths: [ "CHANGELOG.md", ".github/scripts/release-notes.sh" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to update, e.g. v1.1.0 (empty: every release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    name: Update release notes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "${TAG}" ]; then
            tags="${TAG}"
          else
            tags="$(gh release list --limit 100 --json tagName --jq '.[].tagName')"
          fi
          for tag in ${tags}; do
            if ! bash .github/scripts/release-notes.sh "${tag}" > notes.md; then
              echo "Skipping ${tag}: no CHANGELOG.md section"
              continue
            fi
            gh release edit "${tag}" --title "${tag}" --notes-file notes.md
            echo "Updated ${tag}"
          done

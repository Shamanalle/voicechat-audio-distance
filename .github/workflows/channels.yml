name: Mark old versions alpha

# Run by hand (Actions -> Mark old versions alpha -> Run workflow). Every release older than the
# version given becomes an alpha: on GitHub it is marked as a pre-release with "(alpha)" in its name,
# and on Modrinth its channel becomes alpha. Modrinth needs MODRINTH_TOKEN with the "Write versions"
# scope; without it that part is skipped with a warning.

on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Versions below this one become alpha, e.g. 2.0.0'
        type: string
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  alpha:
    name: Mark as alpha
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ inputs.before }}
        run: |
          older() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$1" ]; }
          gh release list --limit 200 --json tagName,name --jq '.[] | "\(.tagName)\t\(.name)"' |
          while IFS=$'\t' read -r tag name; do
            version="${tag#v}"
            if older "${version}" "${BEFORE}"; then
              title="${tag} (alpha)"
              gh release edit "${tag}" --prerelease --title "${title}" > /dev/null
              echo "${tag}: pre-release, \"${title}\""
            fi
          done

      - name: Modrinth versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          BEFORE: ${{ inputs.before }}
        run: |
          project=$(jq -r '.modrinth // ""' .github/publish.json)
          if [ -z "${project}" ] || [ -z "${MODRINTH_TOKEN}" ]; then
            echo "::warning::Modrinth skipped: set \"modrinth\" in .github/publish.json and the MODRINTH_TOKEN secret"
            exit 0
          fi
          agent="User-Agent: Shamanalle/voice-physics (GitHub Actions)"
          older() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -1)" = "$1" ]; }
          curl -sSf -H "${agent}" "https://api.modrinth.com/v2/project/${project}/version" > versions.json
          failed=0
          for row in $(jq -r '.[] | "\(.id)|\(.version_number)|\(.version_type)"' versions.json); do
            IFS='|' read -r id number type <<< "${row}"
            version="${number%%+*}"
            if ! older "${version}" "${BEFORE}" || [ "${type}" = "alpha" ]; then
              continue
            fi
            status=$(curl -sS -o response.txt -w '%{http_code}' -X PATCH \
              -H "Authorization: ${MODRINTH_TOKEN}" -H "Content-Type: application/json" -H "${agent}" \
              --data '{"version_type":"alpha"}' "https://api.modrinth.com/v2/version/${id}")
            if [ "${status}" = "204" ]; then
              echo "${number}: alpha"
            else
              echo "::error::${number}: Modrinth answered ${status} (the token needs the \"Write versions\" scope)"
              cat response.txt
              failed=1
            fi
          done
          exit "${failed}"

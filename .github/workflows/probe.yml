name: Probe (temporary)

# Temporary: lists NeoForge builds for 26.x and prints the event classes a NeoForge entrypoint
# would use. Removed before merging.

on:
  push:
    branches: [ "claude/addon-analysis-improvement-4olq7u" ]
    paths: [ '.github/probe-nf/**', '.github/workflows/probe.yml' ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Versions
        run: |
          echo "== NeoForge versions (last 30)"
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -oP '<version>\K[^<]+' | tail -30
          echo "== ModDevGradle versions (last 10)"
          curl -fsSL https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml | grep -oP '<version>\K[^<]+' | tail -10
          echo "== Simple Voice Chat neoforge artifacts"
          curl -fsSL https://maven.maxhenkel.de/repository/public/de/maxhenkel/voicechat/voicechat-neoforge/maven-metadata.xml 2>/dev/null | grep -oP '<version>\K[^<]+' | tail -5 || true
      - name: NeoForge classes
        run: |
          meta=$(curl -fsSL https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml)
          echo "26.1 builds:"; grep -oP '<version>\K26\.1\.[^<]+' <<< "$meta" | tail -5
          echo "26.3 builds:"; grep -oP '<version>\K26\.3\.[^<]+' <<< "$meta" | tail -3
          nf=26.2.0.88
          curl -fsSL -o nf.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${nf}/neoforge-${nf}-universal.jar"
          echo "== fml jars in the NeoForge pom"
          curl -fsSL "https://maven.neoforged.net/releases/net/neoforged/neoforge/${nf}/neoforge-${nf}.pom" | grep -A2 -E "fancymodloader|<artifactId>(loader|bus)" | grep -oP '<(artifactId|version)>\K[^<]+' | paste - - | head
          fml=$(curl -fsSL "https://maven.neoforged.net/releases/net/neoforged/neoforge/${nf}/neoforge-${nf}.pom" | grep -B1 -A1 "<artifactId>loader</artifactId>" | grep -oP '<version>\K[^<]+' | head -1)
          bus=$(curl -fsSL "https://maven.neoforged.net/releases/net/neoforged/neoforge/${nf}/neoforge-${nf}.pom" | grep -B1 -A1 "<artifactId>bus</artifactId>" | grep -oP '<version>\K[^<]+' | head -1)
          echo "fml=$fml bus=$bus"
          curl -fsSL -o fml.jar "https://maven.neoforged.net/releases/net/neoforged/fancymodloader/loader/${fml}/loader-${fml}.jar" || true
          curl -fsSL -o bus.jar "https://maven.neoforged.net/releases/net/neoforged/bus/${bus}/bus-${bus}.jar" || true
          for c in net.neoforged.neoforge.client.gui.GuiLayer net.neoforged.neoforge.common.NeoForge net.neoforged.neoforge.client.event.ScreenEvent\$Init\$Post net.neoforged.neoforge.client.event.ScreenEvent\$Init net.neoforged.fml.common.Mod net.neoforged.fml.ModContainer net.neoforged.fml.loading.FMLEnvironment net.neoforged.api.distmarker.Dist net.neoforged.bus.api.IEventBus net.neoforged.neoforge.network.handling.IPayloadHandler; do
            echo "-- $c"; javap -cp nf.jar:fml.jar:bus.jar -public "$c" 2>&1 | grep -vE "^Compiled|^}" | head -16
          done

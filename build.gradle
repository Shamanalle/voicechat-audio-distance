plugins {
    id 'base'
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds and packages release JARs for all supported Minecraft versions'
    dependsOn ':fabric-1.21:build', ':fabric-26:build'

    doLast {
        copy {
            from project(':fabric-1.21').layout.buildDirectory.file("libs")
            from project(':fabric-26').layout.buildDirectory.file("libs")
            into layout.buildDirectory.dir("libs")
            include "*.jar"
            exclude "*-dev.jar", "*-sources.jar"
        }
    }
}

tasks.named('build') {
    dependsOn 'buildAll'
}

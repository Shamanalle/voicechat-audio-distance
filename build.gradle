plugins {
    id 'base'
}

// Every release target: the Fabric jar is the full addon. The Forge / NeoForge files are the same jar,
// published under their loader's name: they load the Simple Voice Chat plugin (distance curves,
// configured through config/vc-audio-distance.properties) without the Fabric-only client features.
def releaseTargets = [
        [project: ':fabric-1.20', target: 'mc1.20.1', aliases: ['forge']],
        [project: ':fabric-1.21', target: 'mc1.21.x', aliases: ['neoforge', 'forge']],
        [project: ':fabric-26', target: 'mc26.x', aliases: ['neoforge', 'forge']],
]

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds and collects the release jars for every Minecraft version and loader into build/libs'
    dependsOn releaseTargets.collect { "${it.project}:build" }
    dependsOn ':bukkit:build'

    doLast {
        def outDir = layout.buildDirectory.dir("libs").get().asFile
        outDir.mkdirs()
        releaseTargets.each { t ->
            def version = "${project.mod_version}+${t.target}"
            def jar = file("${project(t.project).layout.buildDirectory.get().asFile}/libs/voicechat-audio-distance-fabric-${version}.jar")
            if (!jar.exists()) {
                throw new GradleException("Expected release jar is missing: ${jar}")
            }
            copy {
                from jar
                into outDir
            }
            t.aliases.each { loader ->
                copy {
                    from jar
                    into outDir
                    rename { "voicechat-audio-distance-${loader}-${version}.jar" }
                }
            }
        }
        // Bukkit / Spigot / Paper / Purpur plugin (server side, every supported Minecraft version)
        def plugin = file("${project(':bukkit').layout.buildDirectory.get().asFile}/libs/voicechat-audio-distance-bukkit-${project.mod_version}.jar")
        if (!plugin.exists()) {
            throw new GradleException("Expected release jar is missing: ${plugin}")
        }
        copy {
            from plugin
            into outDir
        }
    }
}

tasks.named('build') {
    dependsOn 'buildAll'
}

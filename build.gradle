plugins {
    id 'base'
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds and packages release JARs for all supported Minecraft versions and loaders'
    dependsOn ':fabric-1.20:build', ':fabric-1.21:build', ':fabric-26:build'

    doLast {
        def targetDir = layout.buildDirectory.dir("libs").get().asFile
        targetDir.mkdirs()

        // 1. Copy Fabric 1.20.1 release JAR
        def fabric120Jar = file("${project(':fabric-1.20').layout.buildDirectory.get().asFile}/libs/voicechat-audio-distance-fabric-1.1.0+mc1.20.1.jar")
        if (fabric120Jar.exists()) {
            copy {
                from fabric120Jar
                into targetDir
            }
            // 2. Package dedicated Forge 1.20.1 release JAR (with META-INF/mods.toml & @ForgeVoicechatPlugin)
            copy {
                from fabric120Jar
                into targetDir
                rename { "voicechat-audio-distance-forge-1.1.0+mc1.20.1.jar" }
            }
        }

        // 1. Copy Fabric 1.21.x release JAR
        def fabric121Jar = file("${project(':fabric-1.21').layout.buildDirectory.get().asFile}/libs/voicechat-audio-distance-fabric-1.1.0+mc1.21.x.jar")
        if (fabric121Jar.exists()) {
            copy {
                from fabric121Jar
                into targetDir
            }
            // 2. Package dedicated NeoForge release JAR (with full META-INF/neoforge.mods.toml & @ForgeVoicechatPlugin)
            copy {
                from fabric121Jar
                into targetDir
                rename { "voicechat-audio-distance-neoforge-1.1.0+mc1.21.x.jar" }
            }
            // 3. Package dedicated Forge release JAR (with META-INF/mods.toml & @ForgeVoicechatPlugin)
            copy {
                from fabric121Jar
                into targetDir
                rename { "voicechat-audio-distance-forge-1.1.0+mc1.21.x.jar" }
            }
        }

        // 4. Copy Fabric 26.x release JAR
        def fabric26Jar = file("${project(':fabric-26').layout.buildDirectory.get().asFile}/libs/voicechat-audio-distance-fabric-1.1.0+mc26.x.jar")
        if (fabric26Jar.exists()) {
            copy {
                from fabric26Jar
                into targetDir
            }
            // 5. Package dedicated NeoForge 26.x release JAR (with META-INF/neoforge.mods.toml & @ForgeVoicechatPlugin)
            copy {
                from fabric26Jar
                into targetDir
                rename { "voicechat-audio-distance-neoforge-1.1.0+mc26.x.jar" }
            }
            // 6. Package dedicated Forge 26.x release JAR (with META-INF/mods.toml & @ForgeVoicechatPlugin)
            copy {
                from fabric26Jar
                into targetDir
                rename { "voicechat-audio-distance-forge-1.1.0+mc26.x.jar" }
            }
        }
    }
}

tasks.named('build') {
    dependsOn 'buildAll'
}
